name: CI
'on':
  push:
    branches:
    - dev
  pull_request:
    branches:
    - dev
    - staging
    - main
  workflow_call:
    inputs:
      package:
        description: Also pack the release-candidate artifact after the gate passes
        type: boolean
        default: false
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  reuse:
    if: github.event_name == 'pull_request' && (github.base_ref == 'staging' || github.base_ref == 'main')
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      hit: ${{ steps.find.outputs.found == 'true' }}
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
    - name: Checkout (the PR merge commit)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 2
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22
    - name: Resolve the tree that would land
      id: tree
      run: "tree=$(git rev-parse 'HEAD^{tree}')\nhead_tree=$(git rev-parse 'HEAD^2^{tree}' 2>/dev/null || echo unknown)\n\
        echo \"tree=${tree}\" >> \"$GITHUB_OUTPUT\"\necho \"merge tree ${tree}; head tree ${head_tree}\"\nif [ \"\
        ${tree}\" != \"${head_tree}\" ]; then\n  echo \"::notice title=Merge tree differs from the head's::${GITHUB_BASE_REF}\
        \ has changes ${GITHUB_HEAD_REF} lacks; only an artifact of the merge tree counts.\"\nfi\n"
    - name: Find a tested build of this tree
      id: find
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ github.token }}
        TREE: ${{ steps.tree.outputs.tree }}
      run: node scripts/ci/find-tree-artifact.mjs "${TREE}"
    - name: Report
      env:
        FOUND: ${{ steps.find.outputs.found }}
        RUN_ID: ${{ steps.find.outputs.run_id }}
        HEAD_SHA: ${{ steps.find.outputs.head_sha }}
        TREE: ${{ steps.tree.outputs.tree }}
      run: "if [ \"${FOUND}\" = \"true\" ]; then\n  msg=\"tree ${TREE} was built and tested by run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}\
        \ (commit ${HEAD_SHA}); test and cross-platform-pool reuse it.\"\nelse\n  msg=\"no green build of tree ${TREE}\
        \ found; test and cross-platform-pool run in full.\"\nfi\necho \"::notice title=Tree reuse::${msg}\"\necho\
        \ \"${msg}\" >> \"$GITHUB_STEP_SUMMARY\"\n"
  test:
    needs: reuse
    if: ${{ !cancelled() && ((github.base_ref != 'main' && github.ref != 'refs/heads/main') || (needs.reuse.result
      == 'success' && needs.reuse.outputs.hit == 'true')) }}
    name: test (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite:
        - unit
        - browser
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      REUSED: ${{ needs.reuse.outputs.hit == 'true' }}
      TEST_SUITE: ${{ matrix.suite }}
    steps:
    - name: Reused a tested build of this tree
      if: env.REUSED == 'true'
      env:
        RUN_ID: ${{ needs.reuse.outputs.run_id }}
      run: echo "Passed by reuse of run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID} (same git
        tree)."
    - name: Checkout
      if: env.REUSED != 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Install pnpm
      if: env.REUSED != 'true'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
    - name: Setup Node
      if: env.REUSED != 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      if: env.REUSED != 'true'
      run: pnpm install --frozen-lockfile
    - name: Restore Playwright browser cache
      if: env.REUSED != 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cache/ms-playwright
          ~/Library/Caches/ms-playwright
          ~/AppData/Local/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
    - name: Install Playwright browser (chromium)
      if: env.REUSED != 'true'
      timeout-minutes: 15
      run: bash scripts/ci-install-chromium.sh
    - name: Build
      if: env.REUSED != 'true'
      run: pnpm -r build
    - name: Test
      if: env.REUSED != 'true'
      run: |
        if [ "$TEST_SUITE" = unit ]; then
          # Unit suites retain package-root invocations: a whole-workspace
          # process can starve the browser scheduler under shared setup.
          for suite in packages/*/src apps/*/src scripts; do
            pnpm exec vitest run --project unit "$suite"
          done
        else
          # Browser is independently capped at two real-Chromium files by the
          # browser Vitest project, so it can run beside the unit lane safely.
          pnpm exec vitest run --project browser packages apps
        fi
    - name: Lint
      if: env.REUSED != 'true'
      run: pnpm lint
    - name: No-permissive-fallback gate
      if: env.REUSED != 'true'
      run: node scripts/check-no-permissive-fallback.mjs
  cross-platform-pool:
    needs: reuse
    if: ${{ !cancelled() && ((github.base_ref != 'main' && github.ref != 'refs/heads/main') || (needs.reuse.result
      == 'success' && needs.reuse.outputs.hit == 'true')) }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        - macos-latest
    runs-on: ${{ matrix.os == 'ubuntu-latest' && vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404'
      || matrix.os }}
    timeout-minutes: 20
    env:
      REUSED: ${{ needs.reuse.outputs.hit == 'true' }}
    defaults:
      run:
        shell: bash
    steps:
    - name: Reused a tested build of this tree
      if: env.REUSED == 'true'
      env:
        RUN_ID: ${{ needs.reuse.outputs.run_id }}
      run: echo "Passed by reuse of run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID} (same git
        tree)."
    - name: Checkout
      if: env.REUSED != 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Install pnpm
      if: env.REUSED != 'true'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
    - name: Setup Node
      if: env.REUSED != 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      if: env.REUSED != 'true'
      run: pnpm install --frozen-lockfile
    - name: Restore Playwright browser cache
      if: env.REUSED != 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cache/ms-playwright
          ~/Library/Caches/ms-playwright
          ~/AppData/Local/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
    - name: Install Playwright browser (chromium)
      if: env.REUSED != 'true'
      timeout-minutes: 15
      run: bash scripts/ci-install-chromium.sh
    - name: Build
      if: env.REUSED != 'true'
      run: pnpm -r build
    - name: Pool + signal unit tests and real-Chromium pool smoke
      if: env.REUSED != 'true'
      run: pnpm exec vitest run packages/playwright/src
  package:
    needs:
    - test
    - cross-platform-pool
    if: (!cancelled() && needs.test.result == 'success' && needs.cross-platform-pool.result == 'success' && ((github.event_name
      == 'push' && github.ref == 'refs/heads/dev') || inputs.package)) && github.ref != 'refs/heads/main' && github.base_ref
      != 'main' && github.ref_type != 'tag'
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Build and bundle
      run: 'pnpm -r build

        pnpm --filter @jevitate/cli run bundle

        node packages/cli/dist/bin.js --version

        '
    - name: Pack (tarballs, manifest.json, SHA256SUMS)
      id: pack
      run: 'tree=$(git rev-parse ''HEAD^{tree}'')

        echo "tree=${tree}" >> "$GITHUB_OUTPUT"

        bash scripts/ci/pack-release.sh "${RUNNER_TEMP}/release"

        ( cd "${RUNNER_TEMP}/release" && sha256sum -c SHA256SUMS )

        '
    - name: Upload jevitate-<tree>
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: jevitate-${{ steps.pack.outputs.tree }}
        path: ${{ runner.temp }}/release/
        if-no-files-found: error
        retention-days: 90
        compression-level: 0
  build-gate:
    name: Build gate
    needs:
    - reuse
    - test
    - cross-platform-pool
    - package
    - release-policy
    - publication-proof
    if: ${{ always() }}
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
    - name: Require validated checks or exact-tree reuse
      env:
        TARGET: ${{ github.base_ref }}
        REF: ${{ github.ref }}
        REUSE: ${{ needs.reuse.result }}
        HIT: ${{ needs.reuse.outputs.hit }}
        TEST: ${{ needs.test.result }}
        POOL: ${{ needs.cross-platform-pool.result }}
        EVENT: ${{ github.event_name }}
        PACKAGE: ${{ needs.package.result }}
        POLICY: ${{ needs.release-policy.result }}
        PUBLICATION: ${{ needs.publication-proof.result }}
      shell: bash
      run: "set -euo pipefail\nif [ \"$TARGET\" = main ] || [ \"$REF\" = refs/heads/main ]; then\n  test \"$PUBLICATION\"\
        \ = success\nelse\n  test \"$POLICY\" = success\nfi\nset -euo pipefail\ntest \"$TEST\" = success\ntest \"\
        $POOL\" = success\nif [ \"$TARGET\" = main ] || [ \"$REF\" = refs/heads/main ]; then\n  test \"$REUSE\"\
        \ = success\n  test \"$HIT\" = true\nelif [ \"$EVENT\" = push ] && [ \"$REF\" = refs/heads/dev ]; then\n\
        \  test \"$PACKAGE\" = success\nfi\n"
  release-policy:
    name: Release policy regressions
    if: github.base_ref != 'main' && github.ref != 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
    - &id001
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - &id002
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - run: node --test scripts/ci/staged-publication.test.ts
  publication-proof:
    name: Staging publication proof
    needs: reuse
    if: (github.base_ref == 'main' || github.ref == 'refs/heads/main') && needs.reuse.outputs.hit == 'true'
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
    - *id001
    - *id002
    - id: tree
      run: echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: jevitate-${{ steps.tree.outputs.tree }}
        run-id: ${{ needs.reuse.outputs.run_id }}
        github-token: ${{ github.token }}
        path: staged-candidate
    - name: Verify staging publication and exact registry bytes
      env:
        GH_TOKEN: ${{ github.token }}
        BUILD_RUN: ${{ needs.reuse.outputs.run_id }}
      run: node scripts/ci/staged-publication.ts verify staged-candidate

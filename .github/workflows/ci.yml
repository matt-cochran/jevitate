name: CI

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

jobs:
  test:
    runs-on: ubuntu-latest
    # #417: GitHub's default is 6 h; a normal run takes ~13–21 min.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (chromium)
        # playwright is a dependency of @jevitate/cli (and @jevitate/playwright),
        # not a root-level bin, so the script scopes the exec to the package that
        # owns the binary. Each attempt is bounded and retried once (#417).
        timeout-minutes: 10
        run: bash scripts/ci-install-chromium.sh

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm exec vitest run

      - name: Lint
        run: pnpm lint

      - name: No-permissive-fallback gate
        run: node scripts/check-no-permissive-fallback.mjs

  # The browser pool + resource-signal readers must work on Linux, Windows and
  # macOS (WSL2 is covered by local runs: it is the Linux reader with a
  # `wsl2:` source label). Each OS builds, runs @jevitate/playwright's unit
  # tests (fixture-driven signal readers + pool) and a REAL-Chromium pool smoke
  # (one pooled browser, two isolated contexts, admission sample logged as
  # `[pool-smoke] <platform> admission: …`, storageState round-trip, crash →
  # loud failure + relaunch) against that OS's real signal source.
  cross-platform-pool:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # #417: a normal run takes ~1–3 min.
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (chromium)
        # --with-deps installs Linux system packages; Windows/macOS need none.
        timeout-minutes: 10
        run: bash scripts/ci-install-chromium.sh

      - name: Build
        run: pnpm -r build

      - name: Pool + signal unit tests and real-Chromium pool smoke
        run: pnpm exec vitest run packages/playwright/src

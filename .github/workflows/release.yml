name: Release

# Versions @jevitate/cli + jevitate with changesets and publishes them to npm
# through OIDC Trusted Publishing (no NPM_TOKEN, by decision). See RELEASING.md.
#
#   - push to `main`: a `plan` job picks a mode in plain shell:
#       version  - pending .changeset/*.md: run `changeset version` and push the
#                  `changeset-release/main` branch. Actions may not open PRs in
#                  this repo (setting intentionally off), so the run prints the
#                  compare URL and the `gh pr create` command instead of failing.
#       publish  - main's version is NOT on npm yet: print a notice to push the
#                  `vX.Y.Z` tag. A push to main never publishes.
#       none     - nothing pending, and main's version is already on npm.
#   - push of a `vX.Y.Z` tag: PUBLISHES. The tag must equal both packages'
#     version, point at a commit on `main`, and have no pending changesets.
#     Builds, publishes @jevitate/cli then jevitate (a version already on npm is
#     skipped, so a rerun is safe), pushes the package tags and creates the
#     "Jevitate vX.Y.Z" GitHub release from the root CHANGELOG section.
#   - manual run with `publish` checked: the same publish for main's version
#     (a retry path; it also creates the `vX.Y.Z` tag if missing).
#
# Fallback when OIDC publishing fails (npm/cli#9969: E404 on the PUT for repos
# with immutable OIDC subject claims): `bash scripts/release.sh` by hand.
#
# Actions are pinned to commit SHAs (version in the trailing comment). npm is
# pinned to 11: OIDC needs npm >= 11.5.1, and npm 12 rejects the --git-checks
# flag pnpm 9's publish passes through (EUNKNOWNCONFIG, #262).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish main's version to npm via OIDC (retry path; normally push the vX.Y.Z tag)"
        type: boolean
        default: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # #417: never GitHub's 6 h default
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      version: ${{ steps.mode.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Select mode (version | publish | none)
        id: mode
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          alias_version=$(node -p "require('./packages/jevitate-cli-alias/package.json').version")
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          on_npm=$(npm view "@jevitate/cli@${version}" version 2>/dev/null || true)
          alias_on_npm=$(npm view "jevitate@${alias_version}" version 2>/dev/null || true)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            fail() { echo "::error title=Tag ${GITHUB_REF_NAME} not published::$1"; exit 1; }
            [ "${GITHUB_REF_NAME}" = "v${version}" ] || fail "the tag must be v${version} (packages/cli version)."
            [ "${alias_version}" = "${version}" ] || fail "jevitate is ${alias_version} but @jevitate/cli is ${version}."
            [ "$pending" -eq 0 ] || fail "${pending} changeset(s) still pending; merge the version PR first."
            git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || fail "the tagged commit is not on main."
          fi
          if [ "$pending" -gt 0 ]; then
            mode=version
          elif [ -z "$on_npm" ] || [ -z "$alias_on_npm" ]; then
            mode=publish
          else
            mode=none
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "mode=${mode} (event: ${GITHUB_EVENT_NAME} ${GITHUB_REF_NAME}; pending changesets: ${pending}; version ${version})"

      - name: Ready to publish (push the tag)
        if: steps.mode.outputs.mode == 'publish' && github.ref_type != 'tag' && !(github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          VERSION: ${{ steps.mode.outputs.version }}
        run: |
          msg="${VERSION} is not on npm yet. Publish it by tagging main: git tag -a v${VERSION} -m v${VERSION} origin/main && git push origin v${VERSION} (see RELEASING.md)."
          echo "::notice title=Release ${VERSION} is ready to publish::${msg}"
          {
            echo "### Release ${VERSION} is ready to publish"
            echo
            echo "${msg}"
          } >> "$GITHUB_STEP_SUMMARY"

  version:
    needs: plan
    if: needs.plan.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 30  # #417: never GitHub's 6 h default
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version packages (push changeset-release/main)
        id: version
        # The action pushes the branch, then tries to open the PR. Opening it is
        # refused in this repo, so that error is tolerated here; the next step
        # fails the job if the branch itself wasn't pushed.
        continue-on-error: true
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm version-packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

      - name: Open the version PR by hand
        env:
          PR_NUMBER: ${{ steps.version.outputs.pr-number }}
        run: |
          if ! git ls-remote --exit-code --heads origin changeset-release/main >/dev/null; then
            echo "::error::changeset-release/main was not pushed; see the 'Version packages' step log."
            exit 1
          fi
          if [ -n "$PR_NUMBER" ]; then
            echo "Version PR: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}"
            exit 0
          fi
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...changeset-release/main?expand=1"
          cmd='gh pr create --head changeset-release/main --base main --title "chore: version packages" --fill'
          echo "::notice title=Open the version PR by hand::${url} or run: ${cmd}"
          {
            echo "### Open the version PR by hand"
            echo
            echo "Actions may not create pull requests in this repo. \`changeset-release/main\` is pushed; open its PR:"
            echo
            echo "- ${url}"
            echo "- \`${cmd}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    # A pushed vX.Y.Z tag (validated by plan), or a manual run with `publish`.
    needs: plan
    if: needs.plan.outputs.mode == 'publish' && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    timeout-minutes: 30  # #417: never GitHub's 6 h default
    permissions:
      contents: write # tags + GitHub release
      id-token: write # npm OIDC Trusted Publishing (+ provenance)
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Ensure OIDC-capable npm
        # npm >= 11.5.1 for OIDC; not 12 (rejects pnpm 9's --git-checks, #262).
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and bundle
        # pnpm -r build runs packages/cli's build-info pre-step (root tsc --build does not).
        run: |
          pnpm -r build
          pnpm --filter @jevitate/cli run bundle

      - name: Publish to npm (OIDC, provenance)
        # Order matters: jevitate depends on @jevitate/cli (workspace:* is rewritten
        # at pack time), so the cli must be live first. A version already on npm
        # is skipped, so rerunning after a partial publish is safe.
        env:
          NPM_CONFIG_PROVENANCE: "true" # No NPM_TOKEN: OIDC provides publish auth.
        run: |
          for pkg in @jevitate/cli jevitate; do
            if [ -n "$(npm view "${pkg}@${VERSION}" version 2>/dev/null || true)" ]; then
              echo "${pkg}@${VERSION} is already on npm; skipping."
              continue
            fi
            pnpm --filter "${pkg}" publish --access public --no-git-checks
          done

      - name: Tags and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tag in "@jevitate/cli@${VERSION}" "jevitate@${VERSION}" "v${VERSION}"; do
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
              echo "${tag} already exists."
            else
              git tag -a "${tag}" -m "${tag}" "${GITHUB_SHA}"
              git push origin "refs/tags/${tag}"
            fi
          done
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "GitHub release v${VERSION} already exists."
          else
            awk -v v="${VERSION}" 'index($0, "## [" v "]")==1{p=1;next} /^## \[/{if(p)exit} p' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
            gh release create "v${VERSION}" --verify-tag --title "Jevitate v${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md"
          fi

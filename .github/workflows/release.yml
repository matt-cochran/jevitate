name: Release

# Promotes the release candidate that CI built and tested on dev (#534) to npm through OIDC
# Trusted Publishing (no NPM_TOKEN, by decision). See RELEASING.md.
#
# A dev push that passes CI uploads `jevitate-<git tree hash>`: both packages as `pnpm pack`
# tarballs + manifest.json + SHA256SUMS (ci.yml `package`). The staging and main merge commits that
# promote it carry the SAME tree, so this workflow publishes those exact bytes; it never rebuilds
# unless no tested artifact exists. `plan` picks a mode (scripts/ci/release-plan.mjs):
#
#   push to staging   next    - the version is not on npm: verify the tree's artifact and
#                               `npm publish <tgz> --provenance --tag next` (cli, then jevitate).
#   push to main,     latest  - `npm dist-tag add <pkg>@<v> latest` for both (published as next
#   vX.Y.Z tag, or                from staging). If npm lacks the version (staging skipped or
#   manual `publish`              failed) it publishes the artifact with tag latest instead. Then
#                               the package tags, vX.Y.Z and the "Jevitate vX.Y.Z" GitHub release.
#   push to main      version - changesets pending: `changeset version`, push changeset-release/main.
#   otherwise         none
#
# Every step is idempotent (a version on npm is not republished, an existing dist-tag, tag or
# release is left alone), so a rerun or a manual run with `publish` is the retry path. When no
# green artifact exists for the tree, `build` runs CI's full gate + pack in this run (fallback).
# Fallback when the OIDC publish itself fails: `bash scripts/release.sh` by hand.
#
# Actions are pinned to commit SHAs (version in the trailing comment). npm is pinned to 11
# (OIDC needs >= 11.5.1). npm, not pnpm, publishes: pnpm 9's publish never completed npm's OIDC
# exchange (#541).
on:
  push:
    branches: [staging, main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Retry the release for this branch's version (staging: next; main: latest)"
        type: boolean
        default: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # #417: never GitHub's 6 h default
    permissions:
      contents: read
      actions: read # find the tree's artifact
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      needs_artifact: ${{ steps.plan.outputs.needs_artifact }}
      tree: ${{ steps.tree.outputs.tree }}
      artifact_found: ${{ steps.find.outputs.found == 'true' }}
      artifact_run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate the vX.Y.Z tag
        if: github.ref_type == 'tag'
        run: |
          fail() { echo "::error title=Tag ${GITHUB_REF_NAME} not released::$1"; exit 1; }
          version=$(node -p "require('./packages/cli/package.json').version")
          alias_version=$(node -p "require('./packages/jevitate-cli-alias/package.json').version")
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || fail "the tag must be v${version} (packages/cli version)."
          [ "${alias_version}" = "${version}" ] || fail "jevitate is ${alias_version} but @jevitate/cli is ${version}."
          [ "$pending" -eq 0 ] || fail "${pending} changeset(s) still pending; merge the version PR first."
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || fail "the tagged commit is not on main."

      - name: Select mode (next | latest | version | none)
        id: plan
        env:
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: node scripts/ci/release-plan.mjs

      - name: Resolve the tree
        id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Find the tree's tested artifact
        id: find
        if: steps.plan.outputs.needs_artifact == 'true'
        # An API failure is treated as "not found": the fallback build then runs the gate here.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TREE: ${{ steps.tree.outputs.tree }}
        run: node scripts/ci/find-tree-artifact.mjs "${TREE}"

      - name: Report the artifact source
        if: steps.plan.outputs.needs_artifact == 'true'
        env:
          FOUND: ${{ steps.find.outputs.found }}
          RUN_ID: ${{ steps.find.outputs.run_id }}
          TREE: ${{ steps.tree.outputs.tree }}
        run: |
          if [ "${FOUND}" = "true" ]; then
            msg="Publishing tree ${TREE} as built and tested by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}."
            echo "::notice title=Release candidate::${msg}"
          else
            msg="No green CI artifact for tree ${TREE} (dev push run missing, failed or expired). Fallback: running the full gate and packing in this run."
            echo "::warning title=No tested artifact for this tree::${msg}"
          fi
          echo "${msg}" >> "$GITHUB_STEP_SUMMARY"

  # Fallback only: no green artifact for this tree, so run CI's full gate and pack here.
  build:
    needs: plan
    if: needs.plan.outputs.needs_artifact == 'true' && needs.plan.outputs.artifact_found != 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml
    with:
      package: true

  npm:
    needs: [plan, build]
    # `build` is skipped when the dev artifact exists (the usual case).
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.plan.outputs.mode == 'next' || needs.plan.outputs.mode == 'latest') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30  # #417: never GitHub's 6 h default
    permissions:
      contents: read
      actions: read # download the artifact from the dev run
      id-token: write # npm OIDC Trusted Publishing (+ provenance)
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TREE: ${{ needs.plan.outputs.tree }}
      DIST_TAG: ${{ needs.plan.outputs.mode }}
    steps:
      - name: Checkout (scripts only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Ensure OIDC-capable npm
        # npm >= 11.5.1 for OIDC.
        run: npm install -g npm@11

      - name: Download the tested artifact (dev run)
        if: needs.plan.outputs.needs_artifact == 'true' && needs.plan.outputs.artifact_found == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jevitate-${{ needs.plan.outputs.tree }}
          path: ${{ runner.temp }}/release
          run-id: ${{ needs.plan.outputs.artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Download the fallback artifact (this run)
        if: needs.plan.outputs.needs_artifact == 'true' && needs.plan.outputs.artifact_found != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jevitate-${{ needs.plan.outputs.tree }}
          path: ${{ runner.temp }}/release

      - name: Verify checksums, tree and versions
        if: needs.plan.outputs.needs_artifact == 'true'
        run: node scripts/ci/release-artifact.mjs verify "${RUNNER_TEMP}/release" --tree "${TREE}" --version "${VERSION}"

      - name: Publish (${{ needs.plan.outputs.mode }}) and set dist-tags
        # Order matters: jevitate depends on @jevitate/cli, so the cli goes first. A version already
        # on npm is never republished; under `latest` its dist-tag is moved instead (no rebuild, no
        # republish). Moving a dist-tag over OIDC needs the Trusted Publisher's dist-tag permission
        # on npmjs.com for BOTH packages (RELEASING.md).
        run: |
          PKGS="${RUNNER_TEMP}/release"
          for pkg in "@jevitate/cli" "jevitate"; do
            if [ -z "$(npm view "${pkg}@${VERSION}" version 2>/dev/null || true)" ]; then
              if [ ! -f "${PKGS}/manifest.json" ]; then
                echo "::error::${pkg}@${VERSION} is not on npm and no verified artifact was downloaded; rerun with 'publish' checked."
                exit 1
              fi
              file=$(node -p "require(process.argv[1]).files[process.argv[2]]" "${PKGS}/manifest.json" "${pkg}")
              echo "Publishing ${file} as ${pkg}@${VERSION} (tag ${DIST_TAG})"
              npm publish "${PKGS}/${file}" --provenance --access public --tag "${DIST_TAG}" --loglevel verbose
            elif [ "${DIST_TAG}" = "latest" ]; then
              current=$(npm view "${pkg}" dist-tags.latest 2>/dev/null || true)
              if [ "${current}" = "${VERSION}" ]; then
                echo "${pkg}: latest is already ${VERSION}."
              elif ! npm dist-tag add "${pkg}@${VERSION}" latest --loglevel verbose; then
                echo "::error title=Could not move latest for ${pkg}::Enable the Trusted Publisher's dist-tag permission for ${pkg} on npmjs.com, then rerun; or by hand: npm dist-tag add ${pkg}@${VERSION} latest (RELEASING.md)."
                exit 1
              fi
            else
              echo "${pkg}@${VERSION} is already on npm; skipping."
            fi
          done
          {
            echo "### npm"
            for pkg in "@jevitate/cli" "jevitate"; do
              echo "- \`${pkg}\` dist-tags: \`$(npm view "${pkg}" dist-tags --json 2>/dev/null | tr -d '\n ')\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: [plan, npm]
    if: ${{ !cancelled() && needs.plan.outputs.mode == 'latest' && needs.npm.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30  # #417: never GitHub's 6 h default
    permissions:
      contents: write # tags + GitHub release
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tags and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tag in "@jevitate/cli@${VERSION}" "jevitate@${VERSION}" "v${VERSION}"; do
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
              echo "${tag} already exists."
            else
              git tag -a "${tag}" -m "${tag}" "${GITHUB_SHA}"
              git push origin "refs/tags/${tag}"
            fi
          done
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "GitHub release v${VERSION} already exists."
          else
            awk -v v="${VERSION}" 'index($0, "## [" v "]")==1{p=1;next} /^## \[/{if(p)exit} p' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
            gh release create "v${VERSION}" --verify-tag --title "Jevitate v${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md"
          fi

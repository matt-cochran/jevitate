name: Release
'on':
  push:
    branches:
    - staging
    - main
    tags:
    - v*
  workflow_dispatch:
    inputs:
      publish:
        description: 'Retry the release for this branch''s version (staging: next; main: latest)'
        type: boolean
        default: false
concurrency: ${{ github.workflow }}-${{ github.ref }}
permissions:
  contents: read
jobs:
  plan:
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      needs_artifact: ${{ steps.plan.outputs.needs_artifact }}
      tree: ${{ steps.tree.outputs.tree }}
      artifact_found: ${{ steps.find.outputs.found == 'true' }}
      artifact_run_id: ${{ steps.find.outputs.run_id }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22
    - name: Validate the vX.Y.Z tag
      if: github.ref_type == 'tag'
      run: 'fail() { echo "::error title=Tag ${GITHUB_REF_NAME} not released::$1"; exit 1; }

        version=$(node -p "require(''./packages/cli/package.json'').version")

        alias_version=$(node -p "require(''./packages/jevitate-cli-alias/package.json'').version")

        pending=$(find .changeset -maxdepth 1 -name ''*.md'' ! -name ''README.md'' | wc -l)

        [ "${GITHUB_REF_NAME}" = "v${version}" ] || fail "the tag must be v${version} (packages/cli version)."

        [ "${alias_version}" = "${version}" ] || fail "jevitate is ${alias_version} but @jevitate/cli is ${version}."

        [ "$pending" -eq 0 ] || fail "${pending} changeset(s) still pending; merge the version PR first."

        git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || fail "the tagged commit is not on main."

        '
    - name: Select mode (next | latest | version | none)
      id: plan
      env:
        PUBLISH_INPUT: ${{ inputs.publish }}
      run: node scripts/ci/release-plan.mjs
    - name: Resolve the tree
      id: tree
      run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
    - name: Find the successful staging publication
      id: staged
      if: steps.plan.outputs.mode == 'latest'
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: node scripts/ci/find-tree-artifact.mjs --staged "${{ steps.tree.outputs.tree }}"
    - name: Require the staging publication source
      if: steps.plan.outputs.mode == 'latest'
      env:
        FOUND: ${{ steps.staged.outputs.found }}
      run: test "${FOUND}" = "true"
    - name: Find the tree's tested artifact
      id: find
      if: steps.plan.outputs.mode == 'next' || steps.plan.outputs.mode == 'latest'
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ github.token }}
        TREE: ${{ steps.tree.outputs.tree }}
        ARTIFACT_BEFORE: ${{ steps.staged.outputs.published_at }}
      run: node scripts/ci/find-tree-artifact.mjs "${TREE}"
    - name: Report the artifact source
      if: steps.plan.outputs.needs_artifact == 'true'
      env:
        FOUND: ${{ steps.find.outputs.found }}
        RUN_ID: ${{ steps.find.outputs.run_id }}
        TREE: ${{ steps.tree.outputs.tree }}
      run: "if [ \"${FOUND}\" = \"true\" ]; then\n  msg=\"Publishing tree ${TREE} as built and tested by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}.\"\
        \n  echo \"::notice title=Release candidate::${msg}\"\nelse\n  msg=\"No green CI artifact for tree ${TREE}\
        \ (dev push run missing, failed or expired). Fallback: running the full gate and packing in this run.\"\n\
        \  echo \"::warning title=No tested artifact for this tree::${msg}\"\nfi\necho \"${msg}\" >> \"$GITHUB_STEP_SUMMARY\"\
        \n"
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
      if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    - name: Production never rebuilds missing release artifacts
      if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
      env:
        NEEDS_ARTIFACT: ${{ steps.plan.outputs.needs_artifact }}
        FOUND: ${{ steps.find.outputs.found }}
        MODE: ${{ steps.plan.outputs.mode }}
      shell: bash
      run: node scripts/ci/staged-publication.ts plan
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      if: (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && steps.plan.outputs.mode == 'latest'
      with:
        name: jevitate-${{ steps.tree.outputs.tree }}
        run-id: ${{ steps.find.outputs.run_id }}
        github-token: ${{ github.token }}
        path: staged-candidate
    - name: Require successful staging publication of these exact bytes
      if: (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && steps.plan.outputs.mode == 'latest'
      env:
        GH_TOKEN: ${{ github.token }}
        BUILD_RUN: ${{ steps.find.outputs.run_id }}
      run: node scripts/ci/staged-publication.ts verify staged-candidate
  build:
    needs: plan
    if: (needs.plan.outputs.needs_artifact == 'true' && needs.plan.outputs.artifact_found != 'true') && github.ref
      != 'refs/heads/main' && github.ref_type != 'tag'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml
    with:
      package: true
  npm:
    needs:
    - plan
    - build
    if: '!cancelled() && needs.plan.result == ''success'' && (needs.plan.outputs.mode == ''next'' || needs.plan.outputs.mode
      == ''latest'') && (needs.build.result == ''success'' || needs.build.result == ''skipped'')'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TREE: ${{ needs.plan.outputs.tree }}
      DIST_TAG: ${{ needs.plan.outputs.mode }}
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
    steps:
    - name: Checkout (scripts only)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22
        registry-url: https://registry.npmjs.org
    - name: Ensure OIDC-capable npm
      run: npm install -g npm@11
    - name: Download the tested artifact (dev run)
      if: needs.plan.outputs.needs_artifact == 'true' && needs.plan.outputs.artifact_found == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: jevitate-${{ needs.plan.outputs.tree }}
        path: ${{ runner.temp }}/release
        run-id: ${{ needs.plan.outputs.artifact_run_id }}
        github-token: ${{ github.token }}
    - name: Download the fallback artifact (this run)
      if: needs.plan.outputs.needs_artifact == 'true' && needs.plan.outputs.artifact_found != 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: jevitate-${{ needs.plan.outputs.tree }}
        path: ${{ runner.temp }}/release
    - name: Verify checksums, tree and versions
      if: needs.plan.outputs.needs_artifact == 'true'
      run: node scripts/ci/release-artifact.mjs verify "${RUNNER_TEMP}/release" --tree "${TREE}" --version "${VERSION}"
    - name: Publish (${{ needs.plan.outputs.mode }}) and set dist-tags
      run: "PKGS=\"${RUNNER_TEMP}/release\"\nfor pkg in \"@jevitate/cli\" \"jevitate\"; do\n  if [ -z \"$(npm view\
        \ \"${pkg}@${VERSION}\" version 2>/dev/null || true)\" ]; then\n    if [ ! -f \"${PKGS}/manifest.json\"\
        \ ]; then\n      echo \"::error::${pkg}@${VERSION} is not on npm and no verified artifact was downloaded;\
        \ rerun with 'publish' checked.\"\n      exit 1\n    fi\n    file=$(node -p \"require(process.argv[1]).files[process.argv[2]]\"\
        \ \"${PKGS}/manifest.json\" \"${pkg}\")\n    echo \"Publishing ${file} as ${pkg}@${VERSION} (tag ${DIST_TAG})\"\
        \n    npm publish \"${PKGS}/${file}\" --provenance --access public --tag \"${DIST_TAG}\" --loglevel verbose\n\
        \  elif [ \"${DIST_TAG}\" = \"latest\" ]; then\n    current=$(npm view \"${pkg}\" dist-tags.latest 2>/dev/null\
        \ || true)\n    if [ \"${current}\" = \"${VERSION}\" ]; then\n      echo \"${pkg}: latest is already ${VERSION}.\"\
        \n    elif ! npm dist-tag add \"${pkg}@${VERSION}\" latest --loglevel verbose; then\n      echo \"::error\
        \ title=Could not move latest for ${pkg}::Enable the Trusted Publisher's dist-tag permission for ${pkg}\
        \ on npmjs.com, then rerun; or by hand: npm dist-tag add ${pkg}@${VERSION} latest (RELEASING.md).\"\n  \
        \    exit 1\n    fi\n  else\n    echo \"${pkg}@${VERSION} is already on npm; skipping.\"\n  fi\ndone\n{\n\
        \  echo \"### npm\"\n  for pkg in \"@jevitate/cli\" \"jevitate\"; do\n    echo \"- \\`${pkg}\\` dist-tags:\
        \ \\`$(npm view \"${pkg}\" dist-tags --json 2>/dev/null | tr -d '\\n ')\\`\"\n  done\n} >> \"$GITHUB_STEP_SUMMARY\"\
        \n"
  github-release:
    needs:
    - plan
    - npm
    if: ${{ !cancelled() && needs.plan.outputs.mode == 'latest' && needs.npm.result == 'success' }}
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Tags and GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: "git config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\
        \nfor tag in \"@jevitate/cli@${VERSION}\" \"jevitate@${VERSION}\" \"v${VERSION}\"; do\n  if git ls-remote\
        \ --exit-code --tags origin \"refs/tags/${tag}\" >/dev/null; then\n    echo \"${tag} already exists.\"\n\
        \  else\n    git tag -a \"${tag}\" -m \"${tag}\" \"${GITHUB_SHA}\"\n    git push origin \"refs/tags/${tag}\"\
        \n  fi\ndone\nif gh release view \"v${VERSION}\" >/dev/null 2>&1; then\n  echo \"GitHub release v${VERSION}\
        \ already exists.\"\nelse\n  awk -v v=\"${VERSION}\" 'index($0, \"## [\" v \"]\")==1{p=1;next} /^## \\[/{if(p)exit}\
        \ p' CHANGELOG.md > \"${RUNNER_TEMP}/notes.md\"\n  gh release create \"v${VERSION}\" --verify-tag --title\
        \ \"Jevitate v${VERSION}\" --notes-file \"${RUNNER_TEMP}/notes.md\"\nfi\n"

name: Release

# Publishes @jevitate/cli and jevitate to npm via OIDC Trusted Publishing —
# NO stored token (nothing to expire or leak), with build provenance.
#
# PREREQUISITE (one-time, per package, on npmjs.com): configure a Trusted
# Publisher for `@jevitate/cli` AND `jevitate` pointing at this repo
# (matt-cochran/jevitate) and this workflow file (release.yml). Until that is
# done, publishing here fails — see RELEASING.md. The FIRST publish is done by
# hand (`bash scripts/release.sh`), because a Trusted Publisher can only be
# configured for a package that already exists.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # required for npm OIDC Trusted Publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Ensure OIDC-capable npm
        # npm OIDC Trusted Publishing needs npm >= 11.5.1; Node 22 bundles older.
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Bundle @jevitate/cli
        run: pnpm --filter @jevitate/cli run bundle

      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN: OIDC provides publish auth. Provenance is attached.
          NPM_CONFIG_PROVENANCE: "true"
